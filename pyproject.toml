[project]
name = "bharat-data-mcp"
version = "0.1.0"
description = "An MCP server for Indian open government data from data.gov.in"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.0.0,<2.0.0",
    "pydantic>=2.14.1",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
bharat-data-mcp = "bharat_data_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bharat_data_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
